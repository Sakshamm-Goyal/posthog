name: Desktop Build

on:
  pull_request:
  # Required so `Desktop Build Pass` (a required status check) reports on merge
  # queue entries — without it the queue would wait for the check until timeout.
  # The jobs themselves skip on merge_group (the suite already ran in full on
  # the PR) and the aggregator treats skipped as success.
  merge_group:

concurrency:
  group: desktop-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          predicate-quantifier: every
          filters: |
            # Wider excludes than desktop-quality.yml, which keeps .vscode and
            # .claude in scope because Biome lints them.
            code:
              - "desktop/**"
              - "!desktop/**/*.md"
              - "!desktop/docs/**"
              - "!desktop/.vscode/**"
              - "!desktop/.claude/**"
              - "!desktop/.husky/**"
              - "!desktop/LICENSE"
              - "!desktop/.gitignore"
              - "!desktop/.env.example"
            workflow:
              - ".github/workflows/desktop-build.yml"

  build:
    needs: changes
    # Fail closed: if change detection itself failed, run instead of skipping.
    if: ${{ !cancelled() && github.event_name != 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: desktop/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build electron-trpc
        run: pnpm --filter @posthog/electron-trpc build

      - name: Build platform
        run: pnpm --filter @posthog/platform build

      - name: Build shared
        run: pnpm --filter @posthog/shared build

      - name: Build git
        run: pnpm --filter @posthog/git build

      - name: Build enricher
        run: pnpm --filter @posthog/enricher build

      - name: Build harness
        run: pnpm --filter @posthog/harness build

      - name: Build agent
        run: pnpm --filter agent build

      - name: Build code
        run: pnpm --filter code build

  # Collation job for the required status check; must be registered as the
  # required check instead of the individual jobs.
  desktop-build-pass:
    needs: [changes, build]
    name: Desktop Build Pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            echo "Merge queue entry: the suite already ran on the PR."
            exit 0
          fi
          for result in "${{ needs.build.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "A required desktop job did not succeed: $result"
              exit 1
            fi
          done
          echo "All desktop jobs passed or were skipped."
